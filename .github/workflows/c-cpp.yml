cat << 'EOF' > .github/workflows/ci.yml
name: CI C/C++

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make (Build)
        run: make

      - name: Make Test / Check
        run: make test
EOF
